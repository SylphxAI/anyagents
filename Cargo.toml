[workspace]
resolver = "3"
members = [
    "crates/anyagents-core",
    "crates/anyagents-harness",
    "crates/anyagents-harness-stream",
    "crates/anyagents-harness-claude",
    "crates/anyagents-harness-codex",
    "crates/anyagents-harness-opencode",
    "crates/anyagents-harness-agy",
    "crates/anyagents-harness-muse",
    "crates/anyagents-harness-omp",
    "crates/anyagents-harness-spiron",
    "crates/anyagents-agent",
    "crates/anyagents-keeper",
    "crates/anyagents-supervisor",
    "crates/anyagents-installer",
    "crates/anyagents-toolchain",
    "crates/anyagents-channel-telegram",
    "crates/anyagents-gateway",
    "crates/anyagents-guest",
    "crates/anyagents",
    "tests/invariants",
]

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT"
rust-version = "1.98"

# Pure-CPU hashing and PNG/deflate encoding run in integration/unit test
# suites over multi-megabyte payloads; optimize only those leaf dependencies so
# debug builds stay fast while tests do not burn minutes in unoptimized loops.
[profile.dev.package.sha2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.test.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.test.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.test.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.test.package.crc32fast]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.test.package.png]
opt-level = 3
