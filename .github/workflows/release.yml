name: release

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Events are wake-ups, not a queue of release intents. A surviving run reconciles
# every incomplete cut in its main-history snapshot, including evicted events.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  admit:
    if: github.event.repository.visibility == 'public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.admit.outputs.publish }}
      admission: ${{ steps.admit.outputs.admission }}
      matrix: ${{ steps.admit.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_admission.py admit

  release:
    needs: admit
    if: github.event.repository.visibility == 'public' && needs.admit.outputs.publish == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.admit.outputs.matrix) }}
    uses: SylphxAI/mcp-kit/.github/workflows/release.yml@119b4126b2a0fe96371c2a087e7697fec8713eb8
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      kit-ref: 119b4126b2a0fe96371c2a087e7697fec8713eb8
      source-sha: ${{ matrix.source }}
      name: anyagents
      npm-package: '@sylphx/anyagents'
      platforms: darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu
      linux-glibc: '2.34'
      version-arg: --version
      smoke: |
        npx -y "@sylphx/anyagents@$V" --version
        npx -y "@sylphx/anyagents@$V" --help

  receipt:
    needs: [admit, release]
    if: >-
      always() && github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/main' && needs.admit.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publication or record no-op
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION: ${{ needs.admit.outputs.admission }}
          ADMISSION_RESULT: ${{ needs.admit.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: python3 scripts/release_admission.py receipt
