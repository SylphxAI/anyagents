name: ci

# Continuous integration for a public repository: format, clippy and the
# workspace tests on Linux and macOS.
#
# GitHub-hosted standard runners are free only on a public repository, so a
# private one must never reach them: every job here carries
# `github.event.repository.private == false`, and a private repository runs no
# hosted minute. The same rule keeps a self-hosted runner, which a public
# repository could reach with a fork pull request's code, out of this workflow:
# `runs-on` names GitHub-hosted labels only.
#
# `ci-ok` is the one required check. It runs no repository code - it reads the
# other jobs' results and writes a summary - so it stays on the reserved gate
# pool and a superseded run cannot hold its concurrency group.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      takeover:
        description: Run the real Chromium takeover interaction acceptance
        type: boolean
        default: false

permissions:
  contents: read

# A newer push replaces its pull request's run; a merge-group or trunk run is
# never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Whether the change reaches more than documentation, so a docs-only pull
  # request skips the compile and lint jobs. Everything except Markdown under
  # docs/, the root notices and the issue templates counts as code; a run with
  # no diff (main, manual) reports everything changed.
  changes:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request | merge_group) ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/scope.txt"; then
            docs='^(docs/.+\.md|[^/]+\.md|LICENSE[^/]*|\.github/ISSUE_TEMPLATE/.+)$'
            if grep -qvE "$docs" "$RUNNER_TEMP/scope.txt"; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
            echo "$(wc -l < "$RUNNER_TEMP/scope.txt") changed paths" >&2
          else
            # A diff that cannot be computed runs everything rather than skipping.
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The Linux lane: format, clippy and the whole workspace test suite.
  test:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release cut policy
        run: node --test tests/release-cut.test.mjs
      - name: Release admission policy
        run: python3 -m unittest discover -s tests -p 'test_release_admission.py' -v
      - name: Deploy build policy
        run: python3 -m unittest discover -s tests -p 'test_deploy_build.py' -v
      - name: Browser fixture tests
        run: npm test
      - name: Build harness helper binaries
        run: cargo build -p anyagents-harness-opencode --bin fake_opencode --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Takeover interaction acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.takeover && github.event.repository.visibility == 'public'
        env:
          TAKEOVER_EVIDENCE_DIR: ${{ runner.temp }}/takeover-evidence
          ANYAGENTS_CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node --version
          "$ANYAGENTS_CHROMIUM_BIN" --version
          cargo test -p anyagents --bin anyagents --locked \
            browser::tests::mobile_takeover_ui_acceptance -- --ignored --exact --nocapture
          cargo test -p anyagents --bin anyagents --locked \
            browser::tests::takeover_clipboard_ui_acceptance -- --ignored --exact --nocapture
          cargo test -p anyagents --bin anyagents --locked \
            browser::tests::takeover_focus_finds_cross_origin_input -- --ignored --exact --nocapture
          cargo test -p anyagents --bin anyagents --locked \
            releases_held_press -- --ignored --nocapture
          cargo test -p anyagents --bin anyagents --locked \
            browser::tests::takeover_cancel_survives_earlier_stopped_pointerdown -- --ignored --exact --nocapture
      - name: Takeover acceptance evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.takeover && github.event.repository.visibility == 'public'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: takeover-evidence
          path: ${{ runner.temp }}/takeover-evidence
          if-no-files-found: error

      # Same public Linux sudo lane as the cross-UID worktree acceptance.
      # This is required: missing privilege, identity change or setpriv fails.
      - name: Host memory managed-UID admission
        run: |
          set -euo pipefail
          cargo build -p anyagents --bin anyagents --locked --message-format=json > "$RUNNER_TEMP/host-memory-build.json"
          binary=$(python3 -c 'import json,sys; a=[o for line in open(sys.argv[1]) if (o:=json.loads(line)).get("reason")=="compiler-artifact" and o.get("target",{}).get("name")=="anyagents" and not o.get("profile",{}).get("test") and o.get("executable")]; assert len(a)==1; print(a[0]["executable"])' "$RUNNER_TEMP/host-memory-build.json")
          cargo test -p anyagents --bin anyagents --locked --no-run --message-format=json > "$RUNNER_TEMP/host-memory-test-build.json"
          vendor_test=$(python3 -c 'import json,sys; a=[o for line in open(sys.argv[1]) if (o:=json.loads(line)).get("reason")=="compiler-artifact" and o.get("target",{}).get("name")=="anyagents" and o.get("profile",{}).get("test") and o.get("executable")]; assert len(a)==1; print(a[0]["executable"])' "$RUNNER_TEMP/host-memory-test-build.json")
          # RUNNER_TEMP is below the runner's private home, inaccessible to the
          # distinct UID. Only a new owned leaf under public /var/tmp is used;
          # the script verifies ancestry and never changes existing ancestors.
          sudo env ANYAGENTS_REQUIRE_PRIVILEGED_WORKTREE_TEST=1 python3 scripts/verify-host-memory-seat.py --binary "$binary" --vendor-test-binary "$vendor_test" --source-sha "$GITHUB_SHA" --uid 24031 --gid 24032 --socket-gid 24033 --base /var/tmp --receipt "$RUNNER_TEMP/host-memory-seat-receipt.json"
      - name: Host memory managed-UID receipt
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/host-memory-seat-receipt.json" ]; then
            cat "$RUNNER_TEMP/host-memory-seat-receipt.json"
          fi

      - name: Cross-seat worktree writes
        run: |
          set -euo pipefail
          cargo test -p anyagents --bin anyagents --locked --no-run --message-format=json > "$RUNNER_TEMP/worktree-test-build.json"
          test_binary=$(python3 -c 'import json,sys; artifacts=[a for line in open(sys.argv[1]) if (a:=json.loads(line)).get("reason")=="compiler-artifact" and a.get("target",{}).get("name")=="anyagents" and a.get("profile",{}).get("test") and a.get("executable")]; assert len(artifacts)==1; print(artifacts[0]["executable"])' "$RUNNER_TEMP/worktree-test-build.json")
          sudo env ANYAGENTS_REQUIRE_PRIVILEGED_WORKTREE_TEST=1 "$test_binary" --exact create::tests::privileged_cross_uid_spawn_can_create_commit_and_status --nocapture
          sudo env ANYAGENTS_REQUIRE_PRIVILEGED_WORKTREE_TEST=1 "$test_binary" --exact worktree::tests::privileged_pool_seat_workflow_receipt --nocapture

  # The macOS lane: the same gate on a second platform. macOS is a supported
  # host for a long-lived agent, so its build is checked before merge.
  macos:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Browser fixture cleanup
        run: node --test tests/browser-process-group.test.mjs
      - name: Build harness helper binaries
        run: cargo build -p anyagents-harness-opencode --bin fake_opencode --locked
      - name: Test
        run: cargo test --workspace --locked

  # The required check name. Skipped lanes pass; a failed or cancelled lane
  # fails. It reads results only and runs no repository code.
  ci-ok:
    if: always() && !cancelled() && github.event.repository.private == false
    needs: [changes, test, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@b33f1acf5ac75cd568268d46ae00b0132e1ad67a # main
        with:
          needs: ${{ toJSON(needs) }}
