name: ci
run-name: Chromium startup factorial (native and 1 CPU, 8 workers)

# Disposable diagnostic branch only. This replaces a registered manual workflow,
# runs no product tests, publishes no release and never retries the failed group.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-startup-factorial-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  startup-factorial:
    if: github.event.repository.visibility == 'public' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Identify exact image and source
        run: |
          set -euo pipefail
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          test "$ImageVersion" = '20261101.360.1'
          git rev-parse HEAD
          sha256sum scripts/startup_factorial.py
          python3 -m py_compile scripts/startup_factorial.py
      - name: Native VM affinity, 80 observations
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s python3 scripts/startup_factorial.py \
            --out "$RUNNER_TEMP/startup-native" --workers 8 --pairs-per-arm 10 \
            --cpu-count 0 --deadline 30 --mode headless
      - name: Contended 1 CPU, 80 observations
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s python3 scripts/startup_factorial.py \
            --out "$RUNNER_TEMP/startup-cpu1" --workers 8 --pairs-per-arm 10 \
            --cpu-count 1 --deadline 30 --mode headless
      - name: Report measured outcomes, independent of job success
        if: always()
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for phase in ['startup-native', 'startup-cpu1']:
              path = root / phase / 'summary.json'
              if not path.exists():
                  print(f'{phase}: no complete summary; inspect retained partial records')
                  continue
              result = json.loads(path.read_text())
              assert result['observations'] == 80, result['observations']
              assert result['owned_active_children'] == [], result['owned_active_children']
              print(json.dumps({'phase': phase, 'observations': 80, 'arms': {
                  arm: {k: v for k, v in data.items() if k != 'phase'}
                  for arm, data in result['arms'].items()}}, indent=2))
      - name: Preserve diagnostics without browser profiles
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import pathlib, tarfile
          with tarfile.open('startup-evidence.tgz', 'w:gz') as archive:
              for name in ['startup-native', 'startup-cpu1']:
                  root = pathlib.Path(name)
                  if not root.exists():
                      continue
                  for path in root.rglob('*'):
                      if path.is_file() and 'user-data' not in path.parts and path.suffix in ['.json', '.jsonl', '.log', '.conf']:
                          archive.add(path, recursive=False)
          PY
          ls -lh startup-evidence.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chromium-startup-factorial-${{ github.run_id }}
          path: ${{ runner.temp }}/startup-evidence.tgz
          retention-days: 1
          if-no-files-found: error
