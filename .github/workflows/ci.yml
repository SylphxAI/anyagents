name: ci

# Continuous integration for a public repository: module size ratchet, policy
# checks, format, clippy and crate-graph-scoped workspace tests on Linux and
# macOS.
#
# GitHub-hosted standard runners are free only on a public repository, so a
# private one must never reach them: every job here carries
# `github.event.repository.private == false`, and a private repository runs no
# hosted minute. The same rule keeps a self-hosted runner, which a public
# repository could reach with a fork pull request's code, out of this workflow:
# `runs-on` names GitHub-hosted labels only.
#
# `ci-ok` is the one required check. It runs no repository code - it reads the
# other jobs' results and writes a summary - so it stays on the reserved gate
# pool and a superseded run cannot hold its concurrency group.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces its pull request's run; a merge-group or trunk run is
# never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  # Compute crate-graph path-scoping from Cargo.toml and run fast policy and
  # module-size ratchet checks on every run. Docs/markdown/AGENTS.md/
  # tools-only PRs skip heavy Rust and macOS jobs; leaf-crate-only PRs scope
  # clippy/tests to touched crates + Cargo reverse dependents; core/coordinator
  # and non-diff runs (push/main, manual) execute the full workspace suite.
  changes:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      rust_scope: ${{ steps.scope.outputs.rust_scope }}
      cargo_pkg_args: ${{ steps.scope.outputs.cargo_pkg_args }}
      cargo_doc_args: ${{ steps.scope.outputs.cargo_doc_args }}
      run_macos: ${{ steps.scope.outputs.run_macos }}
      run_host_acceptance: ${{ steps.scope.outputs.run_host_acceptance }}
      run_npm: ${{ steps.scope.outputs.run_npm }}
      needs_fake_opencode: ${{ steps.scope.outputs.needs_fake_opencode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Compute crate-graph CI scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request | merge_group)
              if [ -n "$BASE" ] && git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/scope.txt"; then
                echo "$(wc -l < "$RUNNER_TEMP/scope.txt") changed paths" >&2
                python3 tools/ci_scope.py --event "$EVENT" --paths-file "$RUNNER_TEMP/scope.txt" --github-output "$GITHUB_OUTPUT"
              else
                # A diff that cannot be computed runs the full workspace rather than skipping.
                echo "git diff unavailable; falling back to full workspace" >&2
                python3 tools/ci_scope.py --event "$EVENT" --diff-failed --github-output "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              python3 tools/ci_scope.py --event "$EVENT" --github-output "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Module size ratchet
        run: python3 tools/module_size_scan.py
      - name: Tooling tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Release admission policy
        run: python3 -m unittest discover -s tests -p 'test_release_admission.py' -v
      - name: Deploy build policy
        run: python3 -m unittest discover -s tests -p 'test_deploy_build.py' -v
      - name: npm package tests
        if: steps.scope.outputs.run_npm == 'true'
        run: npm test

  # The Linux lane: format, clippy, crate-scoped or workspace tests, plus host
  # acceptance lanes when host/core/coordinator crates are affected.
  test:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.rust_scope != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure linker and nextest
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot 2>/dev/null || true)"
          gccld="$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin/gcc-ld"
          if [ -n "$sysroot" ] && [ -x "$gccld/ld.lld" ] && cc -B"$gccld" -fuse-ld=lld -Wl,--version >/dev/null 2>&1; then
            linker_wrapper="$RUNNER_TEMP/ci-lld-cc"
            printf '#!/bin/sh\nexec cc -B"%s" -fuse-ld=lld "$@"\n' "$gccld" > "$linker_wrapper"
            chmod 0755 "$linker_wrapper"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$linker_wrapper" >> "$GITHUB_ENV"
          fi
          nextest_tgz="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl -fsSL -o "$nextest_tgz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f" "$nextest_tgz" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$nextest_tgz" -C "$HOME/.cargo/bin" cargo-nextest
          rm -f "$nextest_tgz"
          cargo nextest --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sccache
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        env:
          CARGO_PKG_ARGS: ${{ needs.changes.outputs.cargo_pkg_args }}
        run: |
          set -euo pipefail
          read -r -a pkg_args <<< "$CARGO_PKG_ARGS"
          cargo clippy "${pkg_args[@]}" --all-targets --locked -- -D warnings
      - name: Build harness helper binary
        if: needs.changes.outputs.needs_fake_opencode == 'true' && needs.changes.outputs.run_host_acceptance != 'true'
        run: cargo build -p anyagents-harness-opencode --bin fake_opencode --locked
      - name: Build harness helper and runtime binaries
        if: needs.changes.outputs.run_host_acceptance == 'true'
        env:
          NEEDS_FAKE_OPENCODE: ${{ needs.changes.outputs.needs_fake_opencode }}
        run: |
          set -euo pipefail
          build_args=(-p anyagents --bin anyagents)
          if [ "$NEEDS_FAKE_OPENCODE" = "true" ]; then
            build_args+=(-p anyagents-harness-opencode --bin fake_opencode)
          fi
          cargo build "${build_args[@]}" --locked --message-format=json > "$RUNNER_TEMP/prod-build.json"
          binary=$(python3 -c 'import json,sys; a=[o for line in open(sys.argv[1]) if (o:=json.loads(line)).get("reason")=="compiler-artifact" and o.get("target",{}).get("name")=="anyagents" and not o.get("profile",{}).get("test") and o.get("executable")]; assert len(a)==1; print(a[0]["executable"])' "$RUNNER_TEMP/prod-build.json")
          echo "ANYAGENTS_PROD_BIN=$binary" >> "$GITHUB_ENV"
      - name: Test
        env:
          CARGO_PKG_ARGS: ${{ needs.changes.outputs.cargo_pkg_args }}
          CARGO_DOC_ARGS: ${{ needs.changes.outputs.cargo_doc_args }}
        run: |
          set -euo pipefail
          read -r -a pkg_args <<< "$CARGO_PKG_ARGS"
          cargo nextest run "${pkg_args[@]}" --locked --no-fail-fast
          if [ -n "$CARGO_DOC_ARGS" ]; then
            read -r -a doc_args <<< "$CARGO_DOC_ARGS"
            cargo test --doc "${doc_args[@]}" --locked
          fi
      - name: Locate anyagents test binary
        if: needs.changes.outputs.run_host_acceptance == 'true'
        run: |
          set -euo pipefail
          cargo test -p anyagents --bin anyagents --locked --no-run --message-format=json > "$RUNNER_TEMP/unit-test-build.json"
          test_binary=$(python3 -c 'import json,sys; a=[o for line in open(sys.argv[1]) if (o:=json.loads(line)).get("reason")=="compiler-artifact" and o.get("target",{}).get("name")=="anyagents" and o.get("profile",{}).get("test") and o.get("executable")]; assert len(a)==1; print(a[0]["executable"])' "$RUNNER_TEMP/unit-test-build.json")
          echo "ANYAGENTS_UNIT_TEST_BIN=$test_binary" >> "$GITHUB_ENV"

      # Same public Linux sudo lane as the cross-seat repository acceptance.
      # This is required: missing privilege, identity change or setpriv fails.
      - name: Host memory managed-UID admission
        if: needs.changes.outputs.run_host_acceptance == 'true'
        run: |
          set -euo pipefail
          # RUNNER_TEMP is below the runner's private home, inaccessible to the
          # distinct UID. Only a new owned leaf under public /var/tmp is used;
          # the script verifies ancestry and never changes existing ancestors.
          sudo env ANYAGENTS_REQUIRE_PRIVILEGED_WORKTREE_TEST=1 python3 scripts/verify-host-memory-seat.py --binary "$ANYAGENTS_PROD_BIN" --vendor-test-binary "$ANYAGENTS_UNIT_TEST_BIN" --source-sha "$GITHUB_SHA" --uid 24031 --gid 24032 --socket-gid 24033 --base /var/tmp --receipt "$RUNNER_TEMP/host-memory-seat-receipt.json"
      - name: Host memory managed-UID receipt
        if: always() && needs.changes.outputs.run_host_acceptance == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/host-memory-seat-receipt.json" ]; then
            cat "$RUNNER_TEMP/host-memory-seat-receipt.json"
          fi

      - name: Privileged config ACL acceptance
        if: needs.changes.outputs.run_host_acceptance == 'true'
        run: |
          set -euo pipefail
          test_name=seat_tree::privileged_config_tests::privileged_config_acl_cross_uid
          # A missing module/test must not become a successful zero-test run.
          "$ANYAGENTS_UNIT_TEST_BIN" --ignored --exact "$test_name" --list | grep -Fx "$test_name: test"
          sudo env LC_ALL=C ANYAGENTS_REQUIRE_CONFIG_ACL_TEST=1 ANYAGENTS_REQUIRE_NATIVE_SEAT_TEST=1 /usr/bin/setpriv --bounding-set=-dac_override,-dac_read_search -- "$ANYAGENTS_UNIT_TEST_BIN" --ignored --exact "$test_name" --nocapture 2>&1 | tee "$RUNNER_TEMP/config-acl-test.log"
          grep -Fx 'CONFIG_ACL_PRIVILEGED_ACCEPTANCE_EXECUTED' "$RUNNER_TEMP/config-acl-test.log"
          test_name=server::tests::privileged_a2a_private_media_cross_uid
          "$ANYAGENTS_UNIT_TEST_BIN" --ignored --exact "$test_name" --list | grep -Fx "$test_name: test"
          sudo env LC_ALL=C ANYAGENTS_REQUIRE_NATIVE_SEAT_TEST=1 /usr/bin/setpriv --bounding-set=-dac_override,-dac_read_search -- "$ANYAGENTS_UNIT_TEST_BIN" --ignored --exact "$test_name" --nocapture 2>&1 | tee "$RUNNER_TEMP/a2a-media-test.log"
          grep -Fx 'A2A_PRIVATE_MEDIA_CROSS_UID_EXECUTED' "$RUNNER_TEMP/a2a-media-test.log"

      - name: Cross-seat repositories
        if: needs.changes.outputs.run_host_acceptance == 'true'
        run: |
          set -euo pipefail
          # Two seat uids, each committing and pushing in its own repository
          # over one pool, neither able to read the other's Git directory.
          sudo env ANYAGENTS_REQUIRE_PRIVILEGED_WORKTREE_TEST=1 "$ANYAGENTS_UNIT_TEST_BIN" --exact repo::tests::privileged_seats_own_their_repositories --nocapture
          # A file the server opens for a seat is opened by that seat.
          sudo env ANYAGENTS_REQUIRE_PRIVILEGED_WORKTREE_TEST=1 "$ANYAGENTS_UNIT_TEST_BIN" --exact seat_tree::tests::privileged_seat_open_refuses_what_the_seat_cannot_read --nocapture

  # The macOS lane: runs whenever workspace-wide or macOS/platform-branching
  # crates are affected. Skipped for docs/tools-only and Linux-sandbox/leaf PRs.
  macos:
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.run_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Install nextest
        run: |
          set -euo pipefail
          nextest_tgz="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl -fsSL -o "$nextest_tgz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-universal-apple-darwin.tar.gz"
          printf '%s  %s\n' "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a" "$nextest_tgz" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$nextest_tgz" -C "$HOME/.cargo/bin" cargo-nextest
          rm -f "$nextest_tgz"
          cargo nextest --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sccache
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        env:
          CARGO_PKG_ARGS: ${{ needs.changes.outputs.cargo_pkg_args }}
        run: |
          set -euo pipefail
          read -r -a pkg_args <<< "$CARGO_PKG_ARGS"
          cargo clippy "${pkg_args[@]}" --all-targets --locked -- -D warnings
      - name: Build harness helper binaries
        if: needs.changes.outputs.needs_fake_opencode == 'true'
        run: cargo build -p anyagents-harness-opencode --bin fake_opencode --locked
      - name: Test
        env:
          CARGO_PKG_ARGS: ${{ needs.changes.outputs.cargo_pkg_args }}
          CARGO_DOC_ARGS: ${{ needs.changes.outputs.cargo_doc_args }}
        run: |
          set -euo pipefail
          read -r -a pkg_args <<< "$CARGO_PKG_ARGS"
          cargo nextest run "${pkg_args[@]}" --locked --no-fail-fast
          if [ -n "$CARGO_DOC_ARGS" ]; then
            read -r -a doc_args <<< "$CARGO_DOC_ARGS"
            cargo test --doc "${doc_args[@]}" --locked
          fi

  # The required check name. Skipped lanes pass; a failed or cancelled lane
  # fails. It reads results only and runs no repository code.
  ci-ok:
    if: always() && !cancelled() && github.event.repository.private == false
    needs: [changes, test, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@b33f1acf5ac75cd568268d46ae00b0132e1ad67a # main
        with:
          needs: ${{ toJSON(needs) }}
