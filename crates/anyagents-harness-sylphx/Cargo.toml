[package]
name = "anyagents-harness-sylphx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sylphx Agent harness adapter"

[dependencies]
anyagents-core = { path = "../anyagents-core" }
anyagents-harness = { path = "../anyagents-harness" }
anyagents-installer = { path = "../anyagents-installer" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
ignored = []
