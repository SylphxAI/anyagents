[package]
name = "anyagents-tools"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Shared capability core and pluggable workspace backend (LocalHost vs RemoteSandbox) for AnyAgents"

[dependencies]
anyagents-toolchain = { path = "../anyagents-toolchain" }
async-trait = "0.1"
base64 = "0.23"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt", "sync"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
