[package]
name = "anyagents-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Remote-session executor: agents that run as a vendor's remote session, with no local process"

[dependencies]
anyagents-core = { path = "../anyagents-core" }
anyagents-harness = { path = "../anyagents-harness" }
anyagents-keeper = { path = "../anyagents-keeper" }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# The scripted vendor API (`mock`), for this crate's tests and the kernel's.
axum = { version = "0.8", features = ["json"], optional = true }
tempfile = { version = "3", optional = true }

[features]
mock = ["dep:axum", "dep:tempfile", "tokio/net"]

[dev-dependencies]
anyagents-agent = { path = "../anyagents-agent" }
anyagents-remote = { path = ".", features = ["mock"] }
anyagents-supervisor = { path = "../anyagents-supervisor" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
