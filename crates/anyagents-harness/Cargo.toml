[package]
name = "anyagents-harness"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Harness adapter contract and a scripted fake harness"

[dependencies]
base64 = "0.22"
# Pure Rust decoders and encoders for the formats a model is given or a
# channel delivers; no system image library.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
