[package]
name = "anyagents-harness-agy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Antigravity stream adapter"

[features]
# A restart inside one process, driven by the adapter's test double.
double = ["anyagents-harness-stream/double"]

# A scripted vendor for the restart tests: it answers each vendor's own
# protocol and writes down the sessions it was asked to resume. It is not part
# of the released binary.
[[bin]]
name = "restart-agy"
path = "src/bin/vendor_double.rs"
test = false

[[bin]]
name = "anyagents-steer-hook"
path = "src/bin/anyagents-steer-hook.rs"

[dependencies]
anyagents-harness = { path = "../anyagents-harness" }
anyagents-harness-stream = { path = "../anyagents-harness-stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# The adapter with its restart-only helpers, so a test can end a launch the way
# a server going down does.
anyagents-harness-agy = { path = ".", features = ["double"] }


# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []