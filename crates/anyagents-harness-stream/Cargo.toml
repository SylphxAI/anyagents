[package]
name = "anyagents-harness-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Long-lived line-stream child shared by followup adapters"

[dependencies]
anyagents-harness = { path = "../anyagents-harness" }
serde_json = "1"

[features]
# A restart inside one process, driven by an adapter's test double.
double = []


# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[package.metadata.cargo-machete]
ignored = []
