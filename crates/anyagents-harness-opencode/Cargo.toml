[package]
name = "anyagents-harness-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenCode serve adapter"

[dependencies]
anyagents-harness = { path = "../anyagents-harness" }
anyagents-harness-stream = { path = "../anyagents-harness-stream" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# A scripted `opencode` for this crate's tests. The server crate ships the same
# program for its end-to-end test.
[[bin]]
name = "fake_opencode"
path = "tests/bin/fake_opencode.rs"
test = false

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
