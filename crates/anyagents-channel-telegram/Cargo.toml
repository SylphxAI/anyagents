[package]
name = "anyagents-channel-telegram"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Telegram channel: long-poll getUpdates, dedupe on bot and update id"

[dependencies]
anyagents-core = { path = "../anyagents-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
