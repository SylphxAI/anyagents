[package]
name = "anyagents-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Keeps one harness process running for each agent"

[dependencies]
anyagents-agent = { path = "../anyagents-agent" }
anyagents-core = { path = "../anyagents-core" }
anyagents-harness = { path = "../anyagents-harness" }

[dev-dependencies]
anyagents-agent = { path = "../anyagents-agent" }
anyagents-core = { path = "../anyagents-core" }
anyagents-harness = { path = "../anyagents-harness" }
anyagents-harness-claude = { path = "../anyagents-harness-claude" }
tempfile = "3"

[[bin]]
name = "scripted_claude"
path = "../anyagents-harness-claude/src/bin/fake_claude.rs"

[[bin]]
name = "fails_once"
path = "src/bin/fails_once.rs"

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
