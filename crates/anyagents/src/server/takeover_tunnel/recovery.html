<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Desktop takeover</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f8; --panel: #fff; --ink: #18212d; --muted: #4c596a;
  --line: #d6dee7; --status: #714509; --status-bg: #fff0d5;
  --accent: #1856bc; --accent-ink: #fff; --hover: #154693;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161e; --panel: #1a222e; --ink: #edf2fa; --muted: #b4c1d2;
    --line: #3a495b; --status: #ffd483; --status-bg: #46371f;
    --accent: #a4c7ff; --accent-ink: #112a50; --hover: #c6dcff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: clamp(16px, 5vw, 48px); background: var(--bg); color: var(--ink);
  font: 1rem/1.55 system-ui, sans-serif;
}
main { width: min(100%, 33rem); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
header { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 15px clamp(20px, 6vw, 32px); font-weight: 650; }
header svg { flex: none; color: var(--muted); }
section { padding: clamp(20px, 6vw, 32px); }
.badge { display: inline-block; border-radius: 20px; background: var(--status-bg); color: var(--status); font-size: .8125rem; font-weight: 700; padding: 3px 10px; }
h1 { font-size: clamp(1.6rem, 5vw, 2rem); letter-spacing: -.025em; line-height: 1.2; margin: 12px 0; }
p { color: var(--muted); margin: 0; }
dl { border-top: 1px solid var(--line); padding-top: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; margin: 20px 0 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; font-weight: 600; }
.actions:not(:empty) { margin-top: 24px; }
.button, button { display: inline-block; max-width: 100%; padding: 10px 16px; border: 1px solid transparent; border-radius: 8px; min-height: 44px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; text-decoration: none; text-align: center; cursor: pointer; }
.button:hover, button:not(:disabled):hover { background: var(--hover); }
.button:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button:disabled { cursor: wait; opacity: .72; }
#progress:not(:empty), noscript p { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <header><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg> Desktop takeover</header>
  <section aria-labelledby="title">
    <span class="badge"><!--slot--></span>
    <h1 id="title"><!--slot--></h1>
    <p><!--slot--></p><!--slot-->
    <div class="actions"><!--slot--></div>
    <p id="progress" role="status" aria-live="polite"></p>
  </section>
</main>
<script defer src="/assets/takeover-recovery.js"></script>
</body>
</html>
