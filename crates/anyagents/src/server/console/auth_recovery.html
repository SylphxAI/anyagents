<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sign-in recovery · AnyAgents</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script type="module" src="/assets/signin.js"></script>
</head>
<body class="auth">
  <header class="auth-bar"><a class="brand" href="{{HOME_URL}}"><svg class="mark" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M6.2 17.5 11 6.5h2l4.8 11h-2.4l-1-2.4H9.6l-1 2.4H6.2Zm4.2-4.4h3.2L12 9.1l-1.6 4Z" fill="var(--mark-ink)" fill-rule="evenodd"/></svg><span>AnyAgents</span></a><span id="auth-theme"></span></header>
  <main class="auth-main">
    <section class="auth-card">
      <h1>Restart sign-in</h1>
      <div class="problem" role="alert"><div>{{REASON}}</div></div>
      <p class="auth-lede">Start a new sign-in from this browser, or return to the console.</p>
      <a class="btn primary auth-cta" href="{{LOGIN_URL}}">Sign in again</a>
      <a class="btn auth-cta" href="{{HOME_URL}}">Back to console</a>
    </section>
  </main>
</body>
</html>
