[package]
name = "anyagents"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Server, command line, and MCP entry point for long-lived autonomous agents"

[dependencies]
anyagents-channel-telegram = { path = "../anyagents-channel-telegram" }
anyagents-core = { path = "../anyagents-core" }
anyagents-gateway = { path = "../anyagents-gateway" }
anyagents-guest = { path = "../anyagents-guest" }
anyagents-harness = { path = "../anyagents-harness" }
anyagents-harness-agy = { path = "../anyagents-harness-agy" }
anyagents-harness-omp = { path = "../anyagents-harness-omp" }
anyagents-installer = { path = "../anyagents-installer" }
anyagents-keeper = { path = "../anyagents-keeper" }
anyagents-toolchain = { path = "../anyagents-toolchain" }
anyagents-harness-claude = { path = "../anyagents-harness-claude" }
anyagents-harness-stream = { path = "../anyagents-harness-stream" }
anyagents-harness-muse = { path = "../anyagents-harness-muse" }
anyagents-harness-codex = { path = "../anyagents-harness-codex" }
anyagents-harness-opencode = { path = "../anyagents-harness-opencode" }
anyagents-harness-spiron = { path = "../anyagents-harness-spiron" }
anyagents-supervisor = { path = "../anyagents-supervisor" }
agent-memory = { git = "https://github.com/SylphxAI/agent-kit", tag = "v0.1.0", features = ["service"] }
agent-tools = { git = "https://github.com/SylphxAI/agent-kit", tag = "v0.1.0" }
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["service", "tokio"] }
jiff = "0.2"
libc = "0.2"
ring = "0.17"
rmcp = { version = "3.5", features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", features = ["json"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["background_threads_runtime_support"] }

[dev-dependencies]
anyagents-agent = { path = "../anyagents-agent" }
anyagents-core = { path = "../anyagents-core" }

anyagents-harness-agy = { path = "../anyagents-harness-agy" }
anyagents-harness-muse = { path = "../anyagents-harness-muse" }
anyagents-invariants = { path = "../../tests/invariants" }
rmcp = { version = "3.5", features = ["client", "transport-child-process"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

# A scripted `opencode` for the server test: it speaks the CLI's own `serve`
# and `api` surface. It is not part of the released binary.
[[bin]]
name = "scripted_opencode"
path = "src/bin/scripted_opencode.rs"
test = false
