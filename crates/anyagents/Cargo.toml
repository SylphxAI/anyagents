[package]
name = "anyagents"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Server, command line, and MCP entry point for long-lived coding agents"

[dependencies]
anyagents-core = { path = "../anyagents-core" }
axum = { version = "0.8", features = ["json"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rmcp = { version = "3.5", features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-child-process"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
