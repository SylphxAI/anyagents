[package]
name = "anyagents"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Server, command line, and MCP entry point for long-lived coding agents"

[dependencies]
anyagents-channel-telegram = { path = "../anyagents-channel-telegram" }
anyagents-core = { path = "../anyagents-core" }
anyagents-gateway = { path = "../anyagents-gateway" }
anyagents-harness = { path = "../anyagents-harness" }
anyagents-harness-agy = { path = "../anyagents-harness-agy" }
anyagents-harness-omp = { path = "../anyagents-harness-omp" }
anyagents-installer = { path = "../anyagents-installer" }
anyagents-harness-claude = { path = "../anyagents-harness-claude" }
anyagents-harness-stream = { path = "../anyagents-harness-stream" }
anyagents-harness-muse = { path = "../anyagents-harness-muse" }
anyagents-harness-codex = { path = "../anyagents-harness-codex" }
anyagents-harness-opencode = { path = "../anyagents-harness-opencode" }
anyagents-supervisor = { path = "../anyagents-supervisor" }
axum = { version = "0.8", features = ["json"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rmcp = { version = "3.5", features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
anyagents-core = { path = "../anyagents-core" }

anyagents-harness-agy = { path = "../anyagents-harness-agy" }
anyagents-harness-muse = { path = "../anyagents-harness-muse" }
rmcp = { version = "3.5", features = ["client", "transport-child-process"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# A scripted `opencode` for the server test: it speaks the CLI's own `serve`
# and `api` surface. It is not part of the released binary.
[[bin]]
name = "scripted_opencode"
path = "src/bin/scripted_opencode.rs"
test = false
