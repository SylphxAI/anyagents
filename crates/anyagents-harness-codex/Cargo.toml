[package]
name = "anyagents-harness-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Codex app-server adapter"

[dependencies]
anyagents-harness = { path = "../anyagents-harness" }
serde_json = "1"

# A scripted vendor for the restart tests: it answers each vendor's own
# protocol and writes down the sessions it was asked to resume. It is not part
# of the released binary.
[[bin]]
name = "restart-codex"
path = "src/bin/vendor_double.rs"
test = false

[dev-dependencies]
tempfile = "3"

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
