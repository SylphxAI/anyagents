[package]
name = "anyagents-installer"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Harness catalog, lazy install and sign-in"

[dependencies]
anyagents-core = { path = "../anyagents-core" }
anyagents-harness = { path = "../anyagents-harness" }
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "0.9"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
