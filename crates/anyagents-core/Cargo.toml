[package]
name = "anyagents-core"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Identifiers, address grammar, and the durable mailbox"

[features]
# Experiment only: absent from shipping binaries until measured against real searches.
dense-benchmark = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[[example]]
name = "host_dense_benchmark"
required-features = ["dense-benchmark"]

[dependencies]
anyagents-harness = { path = "../anyagents-harness" }
libc = "0.2"
candle-core = { version = "=0.9.1", optional = true, default-features = false }
candle-nn = { version = "=0.9.1", optional = true, default-features = false }
candle-transformers = { version = "=0.9.1", optional = true, default-features = false }
tokenizers = { version = "=0.21.4", optional = true, default-features = false, features = ["fancy-regex"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

# `cargo test --workspace --all-targets` reports the dependencies of a bin or a
# test target as unused in that target. Only a workspace member that is built as
# a linker root (like `anyagents`) is checked; an empty list keeps the ignore
# from matching every crate.
[package.metadata.cargo-machete]
ignored = []
